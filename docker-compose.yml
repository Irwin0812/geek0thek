# ============================================================
# Geek0thek - Docker Compose
# Déploiement cible : Debian 12 (VM 172.16.2.75)
# Compatible reverse proxy externe (X-Forwarded-For / X-Forwarded-Proto)
# ============================================================

name: geek0thek

services:
  db:
    image: postgres:16-alpine
    container_name: geek0thek-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vinyl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-V4ult!Postgres2026}
      POSTGRES_DB: ${POSTGRES_DB:-geek0thek}
    volumes:
      # Persistance locale des données PostgreSQL
      - ./data:/var/lib/postgresql/data
      # Script d'initialisation (exécuté à la 1re création du volume)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinyl} -d ${POSTGRES_DB:-geek0thek}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - geek0thek-net
    # Port DB non exposé sur l'hôte par défaut (sécurité).
    # Décommenter pour un accès local du hôte :
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geek0thek-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-vinyl}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-V4ult!Postgres2026}
      DB_NAME: ${POSTGRES_DB:-geek0thek}
      JWT_SECRET: ${JWT_SECRET:-REMPLACER_PAR_UN_SECRET_ALEATOIRE_LONG}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://172.16.2.75}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Last.fm — photo / logo d'artiste : PRIORITÉ 1 (recherche d'artiste)
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      LASTFM_USER_AGENT: ${LASTFM_USER_AGENT:-Geek0thek/1.0.0 (contact@example.com)}
      # MusicBrainz — import par code-barres (aucun jeton requis)
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-Geek0thek/1.0.0 (contact@example.com)}
      # Google Books — import par ISBN (clé requise)
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # Discogs — recherche par code-barres en complément (jeton requis)
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      DISCOGS_USER_AGENT: ${DISCOGS_USER_AGENT:-Geek0thek/1.0.0 (contact@example.com)}
      DISCOGS_RATE_LIMIT_PER_MINUTE: ${DISCOGS_RATE_LIMIT_PER_MINUTE:-25}
    volumes:
      # Jaquettes : stockage local sur le disque de la VM hôte
      - ./uploads:/app/uploads
    # API non exposée sur l'hôte : elle est servie par nginx (frontend)
    # via /api -> http://backend:8080 (voir frontend/nginx.conf)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - geek0thek-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geek0thek-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Écoute sur la VM cible 172.16.2.75 (surcharge via .env si besoin)
      - "${APP_HOST_IP:-172.16.2.75}:${APP_PORT:-80}:80"
    networks:
      - geek0thek-net

networks:
  geek0thek-net:
    driver: bridge
