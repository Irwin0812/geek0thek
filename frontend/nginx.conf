# ============================================================
# Geek0thek - nginx (serveur statique SPA + proxy API)
# Compatible reverse proxy externe : les en-têtes X-Forwarded-*
# sont propagés en amont (backend Express avec trust proxy = 1).
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    # ------------------------------------------------------------
    # API backend (Express) — proxy HTTP compatible WebSocket
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 12m;
    }

    # ------------------------------------------------------------
    # Jaquettes : servies par le backend depuis le volume local
    # (./uploads sur la VM hôte -> /app/uploads dans le conteneur)
    # ------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------
    # Assets buildés (hashés) : cache long
    # ------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------
    # SPA (React Router) : tout le reste renvoie index.html
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
